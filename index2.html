<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Sencilla</title>
    <style>
        /* Estilos básicos para que se vea bien */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            text-align: center;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 2rem 1rem;
        }
        main {
            padding: 2rem;
            flex: 1;
        }
        footer {
            background-color: #34495e;
            color: white;
            padding: 1rem;
            font-size: 0.9rem;
        }
        h1 {
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Bienvenido a mi sitio web!</h1>
    </header>

    <main>
        <p>Esta es una página web sencilla creada con HTML y CSS básico.</p>
        <p>Puedes editar este archivo para agregar tu propio contenido.</p>
    </main>

    <footer>
        <p>&copy; 2026 - Todos los derechos reservados</p>
    </footer>

</body>
</html>
